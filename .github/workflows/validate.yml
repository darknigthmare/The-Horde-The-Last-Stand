name: Verify game and development guides

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  integrity-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check manifests, rebuild the release, and parse JavaScript
        run: python3 scripts/verify_repository.py --report artifacts/repository-verification.json
      - name: Keep verification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repository-verification
          path: artifacts/repository-verification.json
          if-no-files-found: ignore

  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install the pinned browser test runner
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise combat status effects, wave pacing and journey reports
        run: node scripts/test-combat-0441.cjs
      - name: Verify startup and HTTP companion resources
        run: node scripts/test-startup-web.cjs --out artifacts/startup-web-0441
      - name: Verify campaigns, weapons, lighting and legacy profile transfer
        run: node scripts/regression-0441.cjs
      - name: Verify campaign endings, paid resources and defeat retry
        run: node scripts/test-progression-0442.cjs
      - name: Verify rebinding, gamepad transitions and touch input
        run: node scripts/test-input-0442.cjs
      - name: Verify audio routing, mute and motion preferences
        run: node scripts/test-feedback-0442.cjs
      - name: Verify profile previews, storage failures and concurrent tabs
        run: node scripts/test-storage-0442.cjs
      - name: Compare projected geometry and pixels with the imported release
        run: node scripts/benchmark-projection-0441.cjs --correctness-only --out artifacts/projection-correctness-0441
      - name: Play the production UI at three viewport sizes
        run: node scripts/smoke_game.cjs --out artifacts/smoke-0441
      - name: Keep browser reports and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-regression
          path: artifacts/
          if-no-files-found: ignore
