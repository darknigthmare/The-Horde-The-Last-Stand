name: Verify game and development guides

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  integrity-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check manifests, rebuild the release, and parse JavaScript
        run: python3 scripts/verify_repository.py --report artifacts/repository-verification.json
      - name: Keep verification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repository-verification
          path: artifacts/repository-verification.json
          if-no-files-found: ignore
